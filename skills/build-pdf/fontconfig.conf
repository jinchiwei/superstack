<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  build-pdf fontconfig override.

  Why this file exists:
    WeasyPrint uses Pango + fontconfig for font selection.  By default on
    macOS, fontconfig prefers PingFang TC for Traditional Chinese, and
    weasyprint embeds it as an OpenType-CFF (Type 0C) subset.  Some PDF
    viewers (notably PDFgear) cannot render CFF subsets reliably and
    show CJK characters as blank glyphs even though the font is properly
    embedded.

    This config rejects the macOS-bundled CJK fonts so weasyprint falls
    through to Noto Sans CJK TC (installed via `brew install --cask
    font-noto-sans-cjk`), which has CFF outlines too but is encoded in
    a way that PDFgear and every other tested viewer renders correctly.

  How to install on a new machine:
    1. brew install --cask font-noto-sans-cjk
    2. mkdir -p ~/.config/fontconfig
       cp <this-file> ~/.config/fontconfig/fonts.conf
       fc-cache -frv

    Or run the setup.sh in this skill directory which does both.

  Linux note: On Linux you typically already have Noto Sans CJK from
  your distro's noto-cjk package, and PingFang TC isn't installed at
  all — so this file is a no-op there.  The rejectfont rules just
  silently match nothing.
-->
<fontconfig>
  <selectfont>
    <!-- Reject macOS CJK fonts that produce CFF subsets in PDF output -->
    <rejectfont><pattern><patelt name="family"><string>PingFang TC</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>PingFang SC</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>PingFang HK</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>PingFang MO</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>Heiti TC</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>Heiti SC</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>Hiragino Sans GB</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>Hiragino Sans</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>Hiragino Kaku Gothic ProN</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>Hiragino Mincho ProN</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>Songti TC</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>Songti SC</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>STSong</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>STHeiti</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>STKaiti</string></patelt></pattern></rejectfont>
    <rejectfont><pattern><patelt name="family"><string>STFangsong</string></patelt></pattern></rejectfont>
  </selectfont>
</fontconfig>
